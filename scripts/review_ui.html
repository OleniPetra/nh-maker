<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Static Creo</title>
<link rel="icon" type="image/svg+xml" href="/static-shared/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static-shared/theme.css?v=2">
<style>
  /* Явные color везде — намеренно НЕ используем color-scheme:light dark,
     это и было причиной бага "белый текст на белой кнопке" (нативная тёмная
     UA-раскраска form-элементов). */
  * { box-sizing: border-box; }
  body { margin: 0; }
  .app { display: flex; min-height: 100vh; }
  /* .sidebar* — стили сайдбара теперь инжектит scripts/shared/sidebar.js (общий с audiopng) */

  .content { flex: 1; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 16px; padding: 22px 32px;
    background: var(--bg-page);
  }
  header h1 { font-size: 26px; font-weight: 500; letter-spacing: -0.01em; margin: 0; color: var(--text-primary); }
  header .sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-style: italic; }
  .balance-pill {
    margin-left: auto; background: var(--bg-surface); color: var(--text-body);
    border: 1px solid var(--border-color); padding: 8px 16px;
    border-radius: var(--radius-pill); font-family: var(--font-sans); font-size: 12px;
    font-weight: 600; box-shadow: var(--shadow-sm); white-space: nowrap;
  }
  .balance-pill.low { background: var(--accent-red); color: var(--bg-surface); }

  main { padding: 0 32px 60px; }
  .page { display: none; }
  .page.active { display: block; }

  .panel {
    background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: var(--radius-xl); padding: 24px 26px;
    box-shadow: var(--shadow-sm); margin-bottom: 20px;
  }

  /* .btn — в /static-shared/theme.css */
  button.btn.small { padding: 5px 13px; font-size: 0.68rem; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  #creativesStatus { font-size: 13px; color: var(--text-muted); }
  #creativesStatus.dirty { color: var(--accent-amber); font-weight: 600; }

  select, textarea, input[type=text] {
    font-family: var(--font-sans); font-size: 13px; padding: 8px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-primary);
    outline: none; transition: border-color var(--t-fast);
  }
  select:focus, textarea:focus, input[type=text]:focus { border-color: var(--accent); }
  textarea { resize: vertical; }

  table.data-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  table.data-table th {
    text-align: left; font-family: var(--font-sans); font-size: 0.62rem; text-transform: uppercase;
    letter-spacing: .12em; color: var(--text-secondary); padding: 0 14px 8px; cursor: pointer;
    user-select: none; font-weight: 700; transition: color var(--t-fast);
  }
  table.data-table th:hover { color: var(--text-primary); }
  table.data-table th .arrow { font-size: 9px; margin-left: 3px; }
  table.data-table td { background: var(--bg-surface); padding: 16px; vertical-align: top;
    border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
  table.data-table tr.row td:first-child { border-left: 1px solid var(--border-color); }
  table.data-table tr.row td:last-child { border-right: 1px solid var(--border-color); }
  table.data-table tr.row td:first-child { border-radius: 16px 0 0 16px; }
  table.data-table tr.row td:last-child { border-radius: 0 16px 16px 0; }

  .thumb-cell { display: flex; gap: 12px; }
  .thumb {
    width: 168px; height: 298px; object-fit: cover; border-radius: 12px; background: var(--bg-cream);
    display: block; cursor: zoom-in; flex-shrink: 0;
  }
  .filename-cell { font-size: 11px; color: var(--text-muted); word-break: break-all; margin-top: 8px; max-width: 168px; }

  .branch-score-cell { display: flex; flex-direction: column; gap: 8px; width: 92px; }
  .branch-score-cell select { padding: 6px 8px; font-size: 12px; width: 100%; }
  .score-row { display: flex; gap: 4px; }
  .score-btn {
    font-family: var(--font-sans); font-size: 12px; padding: 6px 0; flex: 1; border-radius: 8px; border: 1.5px solid var(--border-color);
    background: var(--bg-surface); color: var(--text-muted); cursor: pointer;
  }
  .score-btn[data-score="1"].active { background: var(--accent-red); border-color: var(--accent-red); color: var(--bg-surface); }
  .score-btn[data-score="2"].active { background: var(--accent); border-color: var(--accent); color: var(--text-primary); }
  .score-btn[data-score="3"].active { background: var(--text-primary); border-color: var(--text-primary); color: var(--bg-surface); }

  .badge { display: inline-block; padding: 3px 11px; border-radius: var(--radius-pill); font-family: var(--font-sans);
    font-size: 10px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
  .badge.status-new { background: #FDECC8; color: #8A5A00; }
  .badge.status-processed { background: #DCE8D5; color: #3E6B2C; }
  .badge.status-missing_file { background: #FBD9D2; color: #A13B23; }
  .badge.status-csv_orphan { background: var(--bg-subtle); color: var(--text-muted); }
  .badge.stale { background: #FDECC8; color: #8A5A00; }
  .badge.archetype { background: var(--bg-cream); color: var(--text-primary); font-weight: 500; }

  .status-cell { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .status-cell .created-at { font-size: 11px; color: var(--text-muted); }

  .note-cell textarea { width: 100%; min-height: 298px; font-size: 13px; line-height: 1.4; }
  .note-cell { min-width: 320px; }

  .stat-cards { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-card { flex: 1; min-width: 170px; }
  .stat-card h3 { margin: 0 0 8px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .stat-card .num { font-size: 26px; font-weight: 700; }
  .stat-card .score-bar { display: flex; gap: 10px; font-size: 12px; margin-top: 8px; }
  .stat-card .s1 { color: var(--accent-red); } .stat-card .s2 { color: var(--accent-amber); } .stat-card .s3 { color: var(--text-primary); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(34,30,23,.5); display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; z-index: 50; overflow-y: auto; }
  .modal { background: var(--bg-surface); border-radius: 20px; padding: 26px; max-width: 900px; width: 100%; }
  .modal pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--bg-subtle); padding: 14px; border-radius: 12px; max-height: 60vh; overflow: auto; color: var(--text-primary); }

  .log-box { background: var(--text-primary); color: #D8D0C0; font-family: var(--font-mono); font-size: 11.5px;
    line-height: 1.6; padding: 18px; border-radius: var(--radius-lg); max-height: 260px; overflow-y: auto;
    white-space: pre-wrap; margin-bottom: 16px; }

  .brief h3 { margin: 26px 0 10px; font-size: 17px; font-weight: 500; color: var(--text-primary); }
  .brief p { line-height: 1.5; }
  .brief pre.prompt { background: var(--bg-subtle); border: 1px solid var(--border-color); padding: 18px;
    border-radius: var(--radius-lg); font-family: var(--font-mono); font-size: 11.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word; color: var(--text-body); }
  .brief .copy-field { position: relative; }
  /* Кнопки в обычном потоке над промптом, а не absolute поверх него: при position:absolute
     они накрывали первую строку текста, и её было не прочитать. */
  .brief .copy-field-actions { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
  .pattern-list { list-style: none; padding: 0; margin: 0; }
  .pattern-list li { background: var(--bg-subtle); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 8px; font-size: 13px; line-height: 1.55; }
  .pattern-list .src { color: var(--text-muted); font-size: 11px; margin-top: 4px; }

  .history-item {
    border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 10px; cursor: pointer;
    background: var(--bg-surface); border: 1px solid var(--border-color);
    transition: border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
  }
  .history-item:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .history-item .h-niche { font-weight: 700; }
  .history-item .h-meta { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>

<div class="app">
  <div id="sc-sidebar-root"></div>

  <div class="content">
    <header>
      <div>
        <h1 id="pageTitle">Creatives</h1>
        <div class="sub" id="pageSub">Input/images/ + creatives.csv + creatives.db — всё в одной таблице</div>
      </div>
      <span class="balance-pill" id="balance">баланс: ...</span>
    </header>

    <main>
      <section class="page" id="page-creatives">
        <div class="panel">
          <div class="stat-cards" id="statCards"></div>
          <div class="toolbar">
            <button class="btn primary" id="ingestBtn" onclick="Creatives.runIngest()">⟳ Обновить БД (вызывает vision-модель для новых)</button>
            <button class="btn" onclick="Creatives.load()">↻ Обновить список (без API)</button>
            <button class="btn primary" id="saveBtn" onclick="Creatives.saveAll()" disabled>Сохранить всё</button>
            <span id="creativesStatus"></span>
          </div>
          <div id="ingestLog" class="log-box" style="display:none"></div>
          <div style="overflow-x:auto">
            <table class="data-table" id="creativesTable">
              <thead>
                <tr>
                  <th onclick="Creatives.sortBy('filename')">Превью <span class="arrow" id="arrow-filename"></span></th>
                  <th onclick="Creatives.sortBy('branch')">Branch <span class="arrow" id="arrow-branch"></span></th>
                  <th onclick="Creatives.sortBy('score')">Оценка <span class="arrow" id="arrow-score"></span></th>
                  <th onclick="Creatives.sortBy('note')">Подсказка <span class="arrow" id="arrow-note"></span></th>
                  <th onclick="Creatives.sortBy('status')">Статус <span class="arrow" id="arrow-status"></span></th>
                </tr>
              </thead>
              <tbody id="creativesBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="page" id="page-generate">
        <div class="panel">
          <div class="toolbar">
            <select id="genBranch"></select>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
              <input type="checkbox" id="genIncludeHistory" checked style="width:16px;height:16px">
              Учитывать историю прошлых брифов (анти-повтор ниши/архетипа)
            </label>
          </div>
          <textarea id="genHint" placeholder="Необязательная подсказка: например 'сошлись больше на NXR_1013_4...png', 'попробуй лестницу вместо сетки', 'светлая тема'" style="width:100%;min-height:60px;margin-bottom:12px"></textarea>
          <div class="toolbar">
            <button class="btn primary" id="genBtn-gpt_image_2" onclick="Generate.run('gpt_image_2')">Промпт GPT Image 2 + краткий резонинг</button>
            <button class="btn primary" id="genBtn-nano_banana_2" onclick="Generate.run('nano_banana_2')">Промпт Nano Banana 2 + краткий резонинг</button>
            <button class="btn primary" id="genBtn-universal" onclick="Generate.run('universal')">Новая идея + универсальный промпт</button>
          </div>
          <div id="genLog" class="log-box" style="display:none"></div>
          <div id="genResult"></div>
        </div>
      </section>

      <section class="page" id="page-history">
        <div class="panel">
          <div class="toolbar">
            <select id="histBranchFilter" onchange="History.load()"><option value="">Все branch</option></select>
            <button class="btn danger" onclick="History.clearAll()">Очистить историю</button>
          </div>
          <div id="histList"></div>
          <div id="histDetail"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div id="modalRoot"></div>

<script src="/static-shared/sidebar.js?v=6"></script>
<script src="/static-shared/handoff.js?v=2"></script>
<script>
const BRANCHES = ['certif', 'claude', 'aigen'];
const PAGES = ['creatives', 'generate', 'history'];
const TITLES = {
  creatives: ['Creatives', 'Input/images/ + creatives.csv + creatives.db — всё в одной таблице'],
  generate: ['Generate', 'Лёгкий запрос: новая концепция + краткий резонинг + один промпт — какой, выбираете кнопкой'],
  history: ['History', 'Все ранее сгенерированные брифы'],
};

// Сайдбар (иконки/навигация) строит общий scripts/shared/sidebar.js — см. <script src>
// внизу страницы. Здесь только переключение содержимого вкладок.
function showPage(name) {
  PAGES.forEach(p => document.getElementById('page-' + p).classList.toggle('active', p === name));
  // Подсветку пункта в сайдбаре не трогаем — sidebar.js сам слушает hashchange (location.hash
  // ставится ниже) и пересчитывает её. Здесь раньше был селектор "#sc-nav button", который
  // сломался, когда бар разделили на верхнюю и нижнюю группы.
  document.getElementById('pageTitle').textContent = TITLES[name][0];
  document.getElementById('pageSub').textContent = TITLES[name][1];
  location.hash = name;
  if (name === 'creatives') Creatives.load();
  if (name === 'generate') Generate.init();
  if (name === 'history') History.load();
  loadBalance();
}

async function loadBalance() {
  try {
    const res = await fetch('/api/openrouter/credits');
    const d = await res.json();
    const el = document.getElementById('balance');
    if (d.error) { el.textContent = 'баланс: недоступен'; return; }
    const remaining = d.total_credits - d.total_usage;
    el.textContent = `баланс: $${remaining.toFixed(2)}`;
    el.className = 'balance-pill' + (remaining < 1 ? ' low' : '');
  } catch (e) {}
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function pollJob(jobId, logEl, onDone) {
  logEl.style.display = 'block';
  const seen = {n: 0};
  const timer = setInterval(async () => {
    const res = await fetch('/api/job/' + jobId);
    const job = await res.json();
    if (job.lines.length > seen.n) {
      logEl.textContent += job.lines.slice(seen.n).join('\n') + '\n';
      logEl.scrollTop = logEl.scrollHeight;
      seen.n = job.lines.length;
    }
    if (job.done) { clearInterval(timer); onDone(job); }
  }, 1200);
}

// Раньше текст промпта передавался в onclick="copyToClipboard(this, ${JSON.stringify(...)})" —
// ломалось на любом промпте с кавычками внутри: JSON.stringify экранирует их как \", но это
// JS-экранирование, а не HTML-атрибутное, так что браузер обрывал атрибут на первой же кавычке
// и кнопка переставала работать вообще. Исправлено: кнопки больше не носят текст промпта в
// себе — читают его из соседнего <pre class="prompt"> (который уже безопасно экранирован через
// escapeHtml при рендере) через делегированный обработчик кликов ниже.
function copyToClipboard(btn, text) {
  navigator.clipboard.writeText(text);
  const old = btn.textContent;
  btn.textContent = 'Скопировано!';
  setTimeout(() => btn.textContent = old, 1200);
}

document.addEventListener('click', (e) => {
  const copyBtn = e.target.closest('.copy-btn');
  if (copyBtn) {
    const pre = copyBtn.closest('.copy-field').querySelector('.prompt');
    copyToClipboard(copyBtn, pre.textContent);
    return;
  }
  const sendBtn = e.target.closest('.send-gen-btn');
  if (sendBtn) {
    const pre = sendBtn.closest('.copy-field').querySelector('.prompt');
    sendPromptToGeneration(sendBtn, pre.textContent, sendBtn.dataset.model);
  }
});

// Отправляет промпт в AudioPng -> AI Gen с уже выбранной моделью, под которую он был
// сгенерирован — через общий IndexedDB-"ящик" (scripts/shared/handoff.js), тот же механизм,
// которым Competitors Static передаёт готовые картинки в Upload 9:16.
async function sendPromptToGeneration(btn, prompt, model) {
  if (!window.NHHandoff) return;
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = 'Отправляю…';
  try {
    await NHHandoff.stagePrompt({ prompt, model });
    location.href = '/audiopng/?importPrompt=1';
  } catch (e) {
    console.error('send prompt to generation failed', e);
    alert('Не удалось отправить промпт: ' + e.message);
    btn.disabled = false;
    btn.textContent = old;
  }
}

function showModal(html) {
  document.getElementById('modalRoot').innerHTML =
    `<div class="modal-overlay" onclick="if(event.target===this) this.remove()"><div class="modal">${html}</div></div>`;
}

const PROMPT_LABELS = {
  image_prompt_gpt_image_2: 'Промпт — GPT Image 2',
  image_prompt_nano_banana_2: 'Промпт — Nano Banana 2',
  universal_prompt: 'Промпт — универсальный',
};

// Модель для кнопки "Отправить на генерацию" — та же, под которую промпт был написан (ключи
// совпадают с audiopng SAVEZONE_MODELS в audiopng/server.py). universal_prompt не привязан ни
// к одной конкретной модели, поэтому для него кнопка не показывается вовсе.
const PROMPT_MODEL_MAP = {
  image_prompt_gpt_image_2: 'gpt-image-2',
  image_prompt_nano_banana_2: 'nano-banana-2',
};

function renderBrief(brief) {
  const c = brief.new_creative_copy;
  const steps = (c.step_labels || []).map(s => `<li>${escapeHtml(s)}</li>`).join('');

  let reasoningHtml;
  if (brief.reasoning) {
    reasoningHtml = `
      <h3>Резонинг</h3>
      <ul class="pattern-list">
        <li><b>Переиспользовано:</b> ${escapeHtml(brief.reasoning.reused)}</li>
        <li><b>Чего избегали:</b> ${escapeHtml(brief.reasoning.avoided)}</li>
        <li><b>Что нового и почему:</b> ${escapeHtml(brief.reasoning.new_experiment)}</li>
      </ul>`;
  } else {
    // старый формат брифов (до перехода на компактный резонинг) — показываем как есть
    const winning = (brief.winning_patterns || []).map(p =>
      `<li>${escapeHtml(p.pattern)}<div class="src">источники: ${p.supporting_creative_ids.join(', ')}</div></li>`).join('');
    const avoid = (brief.patterns_to_avoid || []).map(p =>
      `<li>${escapeHtml(p.pattern)}<div class="src">источники: ${p.supporting_creative_ids.join(', ')}</div></li>`).join('');
    const rationale = (brief.rationale || []).map(r =>
      `<li><b>${escapeHtml(r.element)}:</b> ${escapeHtml(r.choice)}<br>${escapeHtml(r.reasoning)}<div class="src">источники: ${(r.supporting_creative_ids||[]).join(', ')}</div></li>`).join('');
    reasoningHtml = `
      <h3>Выигрышные паттерны</h3><ul class="pattern-list">${winning}</ul>
      <h3>Чего избегали</h3><ul class="pattern-list">${avoid}</ul>
      <h3>Обоснование по элементам</h3><ul class="pattern-list">${rationale}</ul>`;
  }

  const promptsHtml = Object.keys(PROMPT_LABELS)
    .filter(key => brief[key])
    .map(key => {
      const model = PROMPT_MODEL_MAP[key];
      return `
      <h3>${PROMPT_LABELS[key]}</h3>
      <div class="copy-field">
        <div class="copy-field-actions">
          <button class="btn small copy-btn">Копировать</button>
          ${model ? `<button class="btn small primary send-gen-btn" data-model="${model}">Отправить на генерацию</button>` : ''}
        </div>
        <pre class="prompt">${escapeHtml(brief[key])}</pre>
      </div>`;
    }).join('');

  return `
    <div class="brief">
      <h3>Ниша</h3><p>${escapeHtml(brief.target_audience_niche)}</p>
      <h3>Концепция</h3><p>${escapeHtml(brief.concept_summary)}</p>
      <h3>Копирайт</h3>
      <p><b>Заголовок:</b> ${escapeHtml(c.main_headline)}<br>
         <b>Подзаголовок:</b> ${escapeHtml(c.subheadline_tagline || '-')}<br>
         <b>CTA:</b> ${escapeHtml(c.cta_text)}</p>
      ${steps ? `<ul>${steps}</ul>` : ''}
      ${reasoningHtml}
      ${promptsHtml}
    </div>`;
}

// ---------- Creatives (Review + Database merged) ----------
const Creatives = (() => {
  let rows = [];
  let sortKey = 'status', sortDir = 1;
  const STATUS_LABEL = {new: 'Новый — не в базе', processed: 'В базе', missing_file: 'Файл удалён', csv_orphan: 'Строка в CSV без файла'};

  function setStatus(text, dirty) {
    const el = document.getElementById('creativesStatus');
    el.textContent = text; el.className = dirty ? 'dirty' : '';
    document.getElementById('saveBtn').disabled = !dirty;
  }

  async function load() {
    setStatus('Загрузка...', false);
    const [tableRes, statsRes] = await Promise.all([fetch('/api/table'), fetch('/api/db/summary')]);
    rows = await tableRes.json();
    renderStats(await statsRes.json());
    render();
    const pending = rows.filter(r => r.status === 'new').length;
    setStatus(`Всего: ${rows.length}, требуют занесения в базу: ${pending}`, false);
  }

  function renderStats(summary) {
    const el = document.getElementById('statCards');
    el.innerHTML = Object.entries(summary).map(([branch, s]) => `
      <div class="stat-card">
        <h3>${branch}</h3>
        <div class="num">${s.total}</div>
        <div class="score-bar"><span class="s1">1: ${s.score_1}</span><span class="s2">2: ${s.score_2}</span><span class="s3">3: ${s.score_3}</span></div>
        <div style="margin-top:6px;color:var(--text-muted);font-size:12px">с заметкой: ${s.with_note}</div>
      </div>`).join('') || '<p style="color:var(--text-muted)">База пуста.</p>';
  }

  function sortBy(key) {
    sortDir = (sortKey === key) ? -sortDir : 1;
    sortKey = key;
    render();
  }

  function sortedRows() {
    const scoreRank = {new: 0, processed: 1, missing_file: 2, csv_orphan: 3};
    return [...rows].sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'status') { av = scoreRank[a.status]; bv = scoreRank[b.status]; }
      if (sortKey === 'note') { av = (a.note||'').length; bv = (b.note||'').length; }
      if (av == null) av = '';
      if (bv == null) bv = '';
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });
  }

  function render() {
    ['filename','branch','score','note','status'].forEach(k => {
      document.getElementById('arrow-' + k).textContent = (k === sortKey) ? (sortDir === 1 ? '▲' : '▼') : '';
    });
    const tbody = document.getElementById('creativesBody');
    tbody.innerHTML = sortedRows().map(r => `
      <tr class="row" data-key="${r.key}">
        <td>
          <div class="thumb-cell">
            ${r.thumb_url ? `<img class="thumb" src="${r.thumb_url}" loading="lazy" onclick="Creatives.enlarge('${r.thumb_url}')">` : '<div class="thumb"></div>'}
          </div>
          <div class="filename-cell">${escapeHtml(r.filename || '')}</div>
        </td>
        <td>
          <div class="branch-score-cell">
            <select onchange="Creatives.setField('${r.key}', 'branch', this.value)">
              ${BRANCHES.map(b => `<option value="${b}" ${r.branch===b?'selected':''}>${b}</option>`).join('')}
            </select>
            <div class="score-row">
              ${[1,2,3].map(s => `<button type="button" class="score-btn${r.score===s?' active':''}" data-score="${s}" onclick="Creatives.setScore('${r.key}', ${s}, this)">${s}</button>`).join('')}
            </div>
          </div>
        </td>
        <td class="note-cell"><textarea onchange="Creatives.setField('${r.key}', 'note', this.value)" placeholder="что сработало / не сработало">${escapeHtml(r.note || '')}</textarea></td>
        <td>
          <div class="status-cell">
            <span class="badge status-${r.status}">${STATUS_LABEL[r.status]}</span>
            ${r.archetype ? `<span class="badge archetype">${r.archetype}</span>` : ''}
            ${r.stale ? `<span class="badge stale">⚠ заметка изменилась — обновите БД</span>` : ''}
            ${r.created_at ? `<span class="created-at">добавлен ${r.created_at.slice(0,10)}</span>` : ''}
            ${r.status === 'missing_file' ? `<button class="btn danger small" onclick="Creatives.deleteRow('${r.creative_id}')">Удалить из базы</button>` : ''}
          </div>
        </td>
      </tr>`).join('');
  }

  function setScore(key, score, btn) {
    rows.find(r => r.key === key).score = score;
    btn.parentElement.querySelectorAll('.score-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setStatus('Есть несохранённые изменения', true);
  }
  function setField(key, field, value) {
    rows.find(r => r.key === key)[field] = value;
    setStatus('Есть несохранённые изменения', true);
  }

  async function saveAll() {
    setStatus('Сохранение...', true);
    const payload = rows.filter(r => r.status !== 'csv_orphan').map(r => ({filename: r.filename, score: r.score, note: r.note, branch: r.branch}));
    const res = await fetch('/api/save', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({rows: payload})});
    if (!res.ok) { setStatus('Ошибка сохранения', true); return; }
    await load();
  }

  async function deleteRow(creativeId) {
    if (!confirm('Удалить эту запись из базы и library/ насовсем?')) return;
    await fetch('/api/db/delete', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({creative_id: creativeId})});
    await load();
  }

  async function runIngest() {
    const btn = document.getElementById('ingestBtn');
    btn.disabled = true;
    const logEl = document.getElementById('ingestLog');
    logEl.textContent = '';
    const res = await fetch('/api/run/ingest', {method: 'POST'});
    const data = await res.json();
    if (data.error) { logEl.style.display = 'block'; logEl.textContent = data.error; btn.disabled = false; return; }
    pollJob(data.job_id, logEl, (job) => {
      btn.disabled = false;
      if (job.error) logEl.textContent += '\n[ОШИБКА] ' + job.error;
      load(); loadBalance();
    });
  }

  function enlarge(thumbUrl) {
    showModal(`<img src="${thumbUrl}" style="width:100%;border-radius:12px;display:block">`);
  }

  return {load, sortBy, setScore, setField, saveAll, deleteRow, runIngest, enlarge};
})();

// ---------- Generate ----------
const Generate = (() => {
  let initialized = false;
  function init() {
    if (!initialized) {
      const sel = document.getElementById('genBranch');
      BRANCHES.forEach(b => sel.appendChild(new Option(b, b)));
      initialized = true;
    }
  }
  async function run(mode) {
    const branch = document.getElementById('genBranch').value;
    const hint = document.getElementById('genHint').value;
    const include_history = document.getElementById('genIncludeHistory').checked;
    const buttons = ['gpt_image_2', 'nano_banana_2', 'universal'].map(m => document.getElementById('genBtn-' + m));
    buttons.forEach(b => b.disabled = true);
    document.getElementById('genResult').innerHTML = '';
    const logEl = document.getElementById('genLog');
    logEl.textContent = '';
    const res = await fetch('/api/run/generate', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({branch, mode, hint, include_history})});
    const data = await res.json();
    if (data.error) { logEl.style.display = 'block'; logEl.textContent = data.error; buttons.forEach(b => b.disabled = false); return; }
    pollJob(data.job_id, logEl, (job) => {
      buttons.forEach(b => b.disabled = false);
      loadBalance();
      if (job.error) { document.getElementById('genResult').innerHTML = `<p style="color:var(--accent-red)">${escapeHtml(job.error)}</p>`; return; }
      document.getElementById('genResult').innerHTML = renderBrief(job.result.brief);
    });
  }
  return {init, run};
})();

// ---------- History ----------
const History = (() => {
  let initialized = false;
  function ensureFilter() {
    if (!initialized) {
      const sel = document.getElementById('histBranchFilter');
      BRANCHES.forEach(b => sel.appendChild(new Option(b, b)));
      initialized = true;
    }
  }
  async function load() {
    ensureFilter();
    document.getElementById('histDetail').innerHTML = '';
    const branch = document.getElementById('histBranchFilter').value;
    const res = await fetch('/api/db/briefs' + (branch ? '?branch=' + branch : ''));
    const items = await res.json();
    document.getElementById('histList').innerHTML = items.map(it => `
      <div class="history-item" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
        <div style="cursor:pointer;flex:1" onclick="History.showDetail('${it.brief_id}')">
          <div class="h-niche">${escapeHtml(it.niche || '-')} — ${escapeHtml(it.headline || '')}</div>
          <div class="h-meta">${it.branch} · ${it.archetype || ''} · ${(it.created_at||'').slice(0,16).replace('T',' ')} · ${it.model_used}</div>
        </div>
        <button class="btn danger small" onclick="event.stopPropagation(); History.deleteOne('${it.brief_id}')">Удалить</button>
      </div>`).join('') || '<p style="color:var(--text-muted)">Пока нет сгенерированных брифов.</p>';
  }
  async function showDetail(briefId) {
    const res = await fetch('/api/db/briefs/' + briefId);
    document.getElementById('histDetail').innerHTML = renderBrief(await res.json());
  }
  async function deleteOne(briefId) {
    if (!confirm('Удалить этот бриф из истории насовсем?')) return;
    await fetch('/api/db/briefs/delete', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({brief_id: briefId})});
    document.getElementById('histDetail').innerHTML = '';
    await load();
  }
  async function clearAll() {
    const branch = document.getElementById('histBranchFilter').value;
    const scope = branch ? `branch='${branch}'` : 'ВСЕ branch';
    if (!confirm(`Удалить всю историю брифов (${scope}) насовсем? Это нельзя отменить.`)) return;
    await fetch('/api/db/briefs/clear', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({branch})});
    document.getElementById('histDetail').innerHTML = '';
    await load();
  }
  return {load, showDetail, deleteOne, clearAll};
})();

showPage(PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'creatives');
